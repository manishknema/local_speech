name: VigyanTranscribe CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade pip yt-dlp

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress

      - name: Pub get
        run: flutter pub get

      - name: Cache models in assets/models
        uses: actions/cache@v4
        with:
          path: assets/models
          key: ${{ runner.os }}-models-${{ hashFiles('assets/models/models_manifest.json') }}

      - name: Run unified pipeline (fixtures + analyze + tests + build)
        shell: bash
        env:
          SKIP_DOWNLOAD: 1
          SKIP_CONVERT: 0
          SKIP_NOISY: 0
          ENSURE_MODELS: 0
          RUN_ANALYZE: 1
          RUN_TESTS: 1
          RUN_BUILD: 1
        run: |
          bash scripts/test_pipeline.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vigyantranscribe-${{ matrix.os }}-artifacts
          path: |
            build/**
            test_fixtures/wav16k/**
            test_fixtures/noisy_variants/**
          if-no-files-found: warn
